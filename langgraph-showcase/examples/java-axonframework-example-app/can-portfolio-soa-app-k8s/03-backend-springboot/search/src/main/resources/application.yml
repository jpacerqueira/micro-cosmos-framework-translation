spring:
  application:
    name: search
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/can_app?currentSchema=search}
    username: ${SPRING_DATASOURCE_USERNAME:canadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:canadmin}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: search
    open-in-view: false
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AAD_TENANT_ID:common}/v2.0
          audiences:  ${AAD_CLIENT_ID:api://can}

nats:
  url:      ${NATS_URL:nats://localhost:4222}
  user:     ${NATS_USER:uli-consumer}
  password: ${NATS_PASSWORD:}

server:
  port: 8080
  shutdown: graceful

management:
  server.port: 8081
  endpoints:
    web.exposure.include: health,info,prometheus,metrics
  endpoint:
    health:
      probes.enabled: true
      group:
        readiness: { include: readinessState,db }
        liveness:  { include: livenessState }
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.customer.can: DEBUG
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-}]"
