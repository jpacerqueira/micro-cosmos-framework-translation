spring:
  application:
    name: workflow

axon:
  axonserver:
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
  serializer:
    general: jackson
    events:  jackson
    messages: jackson

nats:
  url:      ${NATS_URL:nats://localhost:4222}
  user:     ${NATS_USER:uli-publisher}
  password: ${NATS_PASSWORD:}

server:
  port: 8080
  shutdown: graceful

management:
  server.port: 8081
  endpoints:
    web.exposure.include: health,info,prometheus,metrics
  endpoint:
    health:
      probes.enabled: true
      group:
        readiness: { include: readinessState,axonServer }
        liveness:  { include: livenessState }
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.customer.can: DEBUG
    org.axonframework: INFO
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-}]"
