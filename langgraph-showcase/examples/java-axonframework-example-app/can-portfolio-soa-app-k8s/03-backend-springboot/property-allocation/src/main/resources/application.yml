###############################################################################
# property-allocation - Spring Boot configuration. Profile-driven so the same
# image runs locally (default) and in Kubernetes (k8s) with env-var overrides.
###############################################################################
spring:
  application:
    name: property-allocation
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true
    open-in-view: false
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/can_app?currentSchema=portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:canadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:canadmin}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
      leak-detection-threshold: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: portfolio
    default-schema: portfolio
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AAD_TENANT_ID:common}/v2.0
          audiences: ${AAD_CLIENT_ID:api://can}

axon:
  axonserver:
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
  serializer:
    general: jackson
    events:  jackson
    messages: jackson

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  server.port: 8081
  endpoints:
    web.exposure.include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      probes.enabled: true
      group:
        readiness:
          include: readinessState,db,axonServer
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
  tracing:
    sampling.probability: 0.1

# NATS - ULI publisher.
nats:
  url:      ${NATS_URL:nats://localhost:4222}
  user:     ${NATS_USER:uli-publisher}
  password: ${NATS_PASSWORD:}

# Logging - JSON for SAD's "Structure Your Log Data" pattern.
logging:
  level:
    root: INFO
    com.customer.can: DEBUG
    org.axonframework: INFO
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-}]"
