port:      4222
http_port: 8222

jetstream {
  store_dir:        /data/jetstream
  max_memory_store: 256MB
  max_file_store:   2GB
}

# Two application users — same password for local dev simplicity.
authorization {
  users [
    { user: "uli-publisher", password: "nats-local-pass" }
    { user: "uli-consumer",  password: "nats-local-pass" }
  ]
}
