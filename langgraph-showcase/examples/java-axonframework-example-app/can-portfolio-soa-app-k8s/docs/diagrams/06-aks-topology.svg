<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, sans-serif">
  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f4e79"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#fafbfc"/>
  <text x="600" y="34" font-size="22" font-weight="bold" fill="#1f4e79" text-anchor="middle">
    AKS Network Topology + Security Boundaries
  </text>

  <!-- Internet -->
  <rect x="60" y="80" width="160" height="60" rx="6" fill="#fff" stroke="#1f4e79"/>
  <text x="140" y="115" font-size="13" font-weight="bold" text-anchor="middle">Internet</text>

  <!-- WAF -->
  <rect x="260" y="80" width="180" height="60" rx="6" fill="#fff7e6" stroke="#b06b00"/>
  <text x="350" y="105" font-size="13" font-weight="bold" text-anchor="middle">App Gateway / WAF</text>
  <text x="350" y="125" font-size="11" text-anchor="middle">DDoS, OWASP rules</text>

  <!-- VNet -->
  <rect x="80" y="180" width="1080" height="460" rx="10" fill="none" stroke="#1f4e79" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="100" y="205" font-size="13" font-weight="bold" fill="#1f4e79">Hub-Spoke VNet  10.0.0.0/16</text>

  <!-- AKS subnet -->
  <rect x="120" y="230" width="640" height="380" rx="6" fill="#fff" stroke="#1f4e79"/>
  <text x="140" y="252" font-size="12" font-weight="bold">AKS Subnet  10.0.1.0/24</text>

  <!-- Istio Ingress -->
  <rect x="160" y="270" width="200" height="60" rx="4" fill="#fff7e6" stroke="#b06b00"/>
  <text x="260" y="293" font-size="12" font-weight="bold" text-anchor="middle">Istio Ingress Gateway</text>
  <text x="260" y="312" font-size="10" text-anchor="middle">internal LB</text>

  <!-- Namespaces -->
  <rect x="160" y="350" width="280" height="80" rx="4" fill="#e8f5e9" stroke="#1b5e20"/>
  <text x="300" y="372" font-size="12" font-weight="bold" text-anchor="middle">ns: can-app</text>
  <text x="300" y="392" font-size="10" text-anchor="middle">microservices</text>
  <text x="300" y="410" font-size="10" text-anchor="middle">PSS: restricted</text>

  <rect x="460" y="350" width="280" height="80" rx="4" fill="#e3f2fd" stroke="#0d47a1"/>
  <text x="600" y="372" font-size="12" font-weight="bold" text-anchor="middle">ns: can-system</text>
  <text x="600" y="392" font-size="10" text-anchor="middle">NATS, Axon, OTel</text>
  <text x="600" y="410" font-size="10" text-anchor="middle">PSS: restricted</text>

  <rect x="160" y="450" width="280" height="80" rx="4" fill="#fce4ec" stroke="#880e4f"/>
  <text x="300" y="472" font-size="12" font-weight="bold" text-anchor="middle">ns: istio-system</text>
  <text x="300" y="492" font-size="10" text-anchor="middle">control plane</text>

  <rect x="460" y="450" width="280" height="80" rx="4" fill="#ede7f6" stroke="#311b92"/>
  <text x="600" y="472" font-size="12" font-weight="bold" text-anchor="middle">ns: observability</text>
  <text x="600" y="492" font-size="10" text-anchor="middle">OTel collector</text>

  <text x="180" y="568" font-size="10" fill="#666">+ Network policies (default-deny per ns)</text>
  <text x="180" y="585" font-size="10" fill="#666">+ Cilium dataplane (eBPF)</text>
  <text x="180" y="602" font-size="10" fill="#666">+ Workload Identity (no kubelet secrets)</text>

  <!-- Private endpoints -->
  <rect x="800" y="240" width="320" height="80" rx="6" fill="#fce4ec" stroke="#880e4f"/>
  <text x="960" y="265" font-size="13" font-weight="bold" text-anchor="middle">Private endpoints</text>
  <text x="960" y="288" font-size="11" text-anchor="middle">PostgreSQL Flexible (Citus)</text>
  <text x="960" y="306" font-size="11" text-anchor="middle">Storage, Key Vault, ACR</text>

  <!-- Bastion / mgmt -->
  <rect x="800" y="350" width="320" height="80" rx="6" fill="#fff" stroke="#1f4e79"/>
  <text x="960" y="375" font-size="13" font-weight="bold" text-anchor="middle">Management</text>
  <text x="960" y="395" font-size="11" text-anchor="middle">Azure Bastion (jump-box)</text>
  <text x="960" y="413" font-size="11" text-anchor="middle">RBAC + Just-in-Time access</text>

  <!-- Egress -->
  <rect x="800" y="460" width="320" height="80" rx="6" fill="#fff" stroke="#1f4e79"/>
  <text x="960" y="485" font-size="13" font-weight="bold" text-anchor="middle">Egress</text>
  <text x="960" y="505" font-size="11" text-anchor="middle">Azure Firewall</text>
  <text x="960" y="523" font-size="11" text-anchor="middle">FQDN allow-list</text>

  <!-- Arrows -->
  <line x1="220" y1="110" x2="260" y2="110" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="350" y1="140" x2="260" y2="270" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="260" y1="330" x2="300" y2="350" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="300" y1="430" x2="600" y2="450" stroke="#1f4e79" stroke-width="1" marker-end="url(#a6)"/>
  <line x1="440" y1="390" x2="460" y2="390" stroke="#1f4e79" stroke-width="1" marker-end="url(#a6)"/>
  <line x1="740" y1="390" x2="800" y2="280" stroke="#880e4f" stroke-width="1" marker-end="url(#a6)"/>
  <line x1="740" y1="390" x2="800" y2="500" stroke="#1f4e79" stroke-width="1" marker-end="url(#a6)"/>

  <text x="600" y="675" font-size="11" fill="#666" text-anchor="middle">
    Hub-spoke VNet, private endpoints for all PaaS data services, default-deny network policies, mTLS STRICT inside the mesh.
  </text>
</svg>
