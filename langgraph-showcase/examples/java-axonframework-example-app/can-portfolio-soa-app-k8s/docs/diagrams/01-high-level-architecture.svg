<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f4e79"/>
    </marker>
    <linearGradient id="azure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7f1fb"/>
      <stop offset="100%" stop-color="#cfe1f5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="#fafbfc"/>

  <!-- Title -->
  <text x="600" y="34" font-size="22" font-weight="bold" fill="#1f4e79" text-anchor="middle">
    Customer-Application-Name - High-Level Architecture
  </text>

  <!-- Users -->
  <rect x="40" y="80" width="180" height="120" rx="6" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="130" y="105" font-size="14" font-weight="bold" text-anchor="middle">Users</text>
  <text x="130" y="135" font-size="12" text-anchor="middle">Internal (Azure AD)</text>
  <text x="130" y="155" font-size="12" text-anchor="middle">External (B2B Guest)</text>
  <text x="130" y="180" font-size="11" fill="#666" text-anchor="middle">Browser / Web App</text>

  <!-- Edge / Azure AD -->
  <rect x="280" y="80" width="200" height="120" rx="6" fill="url(#azure)" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="380" y="105" font-size="14" font-weight="bold" text-anchor="middle">Azure AD (IDaaS)</text>
  <text x="380" y="130" font-size="12" text-anchor="middle">OAuth2 / OpenID Connect</text>
  <text x="380" y="150" font-size="12" text-anchor="middle">B2B + MFA</text>
  <text x="380" y="180" font-size="11" fill="#666" text-anchor="middle">Issues JWT</text>

  <!-- Istio Ingress -->
  <rect x="540" y="80" width="220" height="120" rx="6" fill="url(#azure)" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="650" y="105" font-size="14" font-weight="bold" text-anchor="middle">Istio Ingress Gateway</text>
  <text x="650" y="130" font-size="12" text-anchor="middle">TLS termination</text>
  <text x="650" y="150" font-size="12" text-anchor="middle">JWT validation</text>
  <text x="650" y="180" font-size="11" fill="#666" text-anchor="middle">api.example.com</text>

  <!-- WebApp UI -->
  <rect x="820" y="80" width="180" height="120" rx="6" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="910" y="105" font-size="14" font-weight="bold" text-anchor="middle">WebApp UI</text>
  <text x="910" y="130" font-size="12" text-anchor="middle">React + TypeScript</text>
  <text x="910" y="150" font-size="12" text-anchor="middle">npm build, nginx</text>
  <text x="910" y="180" font-size="11" fill="#666" text-anchor="middle">Static bundle</text>

  <!-- AKS cluster boundary -->
  <rect x="40" y="240" width="1120" height="380" rx="10" fill="none" stroke="#1f4e79" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="60" y="265" font-size="14" font-weight="bold" fill="#1f4e79">AKS - Istio Service Mesh (mTLS STRICT)</text>

  <!-- BFF -->
  <rect x="80" y="290" width="200" height="100" rx="6" fill="#fff7e6" stroke="#b06b00" stroke-width="1.5"/>
  <text x="180" y="315" font-size="13" font-weight="bold" text-anchor="middle">WebApp BFF</text>
  <text x="180" y="335" font-size="11" text-anchor="middle">GraphQL + REST</text>
  <text x="180" y="352" font-size="11" text-anchor="middle">Spring Boot 3.2</text>
  <text x="180" y="372" font-size="10" fill="#666" text-anchor="middle">Axon CommandGateway</text>

  <!-- Microservices -->
  <g>
    <rect x="320" y="290" width="160" height="60" rx="6" fill="#e8f5e9" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="400" y="313" font-size="12" font-weight="bold" text-anchor="middle">user-auth</text>
    <text x="400" y="333" font-size="10" text-anchor="middle">B2B invitations</text>

    <rect x="320" y="370" width="160" height="60" rx="6" fill="#e8f5e9" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="400" y="393" font-size="12" font-weight="bold" text-anchor="middle">property-allocation</text>
    <text x="400" y="413" font-size="10" text-anchor="middle">CQRS aggregate</text>

    <rect x="320" y="450" width="160" height="60" rx="6" fill="#e8f5e9" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="400" y="473" font-size="12" font-weight="bold" text-anchor="middle">vdr-ingestion</text>
    <text x="400" y="493" font-size="10" text-anchor="middle">Tika / POI / PDFBox</text>

    <rect x="500" y="290" width="160" height="60" rx="6" fill="#e8f5e9" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="580" y="313" font-size="12" font-weight="bold" text-anchor="middle">workflow</text>
    <text x="580" y="333" font-size="10" text-anchor="middle">Axon Sagas</text>

    <rect x="500" y="370" width="160" height="60" rx="6" fill="#e8f5e9" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="580" y="393" font-size="12" font-weight="bold" text-anchor="middle">search</text>
    <text x="580" y="413" font-size="10" text-anchor="middle">PG full-text</text>
  </g>

  <!-- Platform layer -->
  <g>
    <rect x="700" y="290" width="180" height="60" rx="6" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="790" y="313" font-size="12" font-weight="bold" text-anchor="middle">Axon Server</text>
    <text x="790" y="333" font-size="10" text-anchor="middle">Event store + CQRS bus</text>

    <rect x="700" y="370" width="180" height="60" rx="6" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="790" y="393" font-size="12" font-weight="bold" text-anchor="middle">NATS JetStream</text>
    <text x="790" y="413" font-size="10" text-anchor="middle">3-node cluster, ULI</text>

    <rect x="700" y="450" width="180" height="60" rx="6" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="790" y="473" font-size="12" font-weight="bold" text-anchor="middle">Key Vault CSI</text>
    <text x="790" y="493" font-size="10" text-anchor="middle">Secrets via Workload Id</text>
  </g>

  <!-- Data tier -->
  <g>
    <rect x="920" y="290" width="200" height="60" rx="6" fill="#fce4ec" stroke="#880e4f" stroke-width="1.5"/>
    <text x="1020" y="313" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL + Citus</text>
    <text x="1020" y="333" font-size="10" text-anchor="middle">Sharded by portfolio_id</text>

    <rect x="920" y="370" width="200" height="60" rx="6" fill="#fce4ec" stroke="#880e4f" stroke-width="1.5"/>
    <text x="1020" y="393" font-size="12" font-weight="bold" text-anchor="middle">Storage (GPv2)</text>
    <text x="1020" y="413" font-size="10" text-anchor="middle">VDR raw / clean blobs</text>

    <rect x="920" y="450" width="200" height="60" rx="6" fill="#fce4ec" stroke="#880e4f" stroke-width="1.5"/>
    <text x="1020" y="473" font-size="12" font-weight="bold" text-anchor="middle">Event Hubs (Kafka)</text>
    <text x="1020" y="493" font-size="10" text-anchor="middle">ULI durable bridge</text>
  </g>

  <!-- Observability bottom -->
  <rect x="80" y="540" width="1040" height="60" rx="6" fill="#ede7f6" stroke="#311b92" stroke-width="1.5"/>
  <text x="600" y="563" font-size="13" font-weight="bold" text-anchor="middle">
    Azure Monitor / Log Analytics / Application Insights / Prometheus / OpenTelemetry
  </text>
  <text x="600" y="585" font-size="11" text-anchor="middle">
    Centralised logging, metrics, distributed traces with correlationId propagation
  </text>

  <!-- Connections -->
  <line x1="220" y1="140" x2="280" y2="140" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="140" x2="540" y2="140" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="140" x2="820" y2="140" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="200" x2="180" y2="290" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="280" y1="340" x2="320" y2="320" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="280" y1="340" x2="320" y2="400" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="280" y1="340" x2="320" y2="480" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="480" y1="320" x2="500" y2="320" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="480" y1="400" x2="500" y2="400" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="660" y1="320" x2="700" y2="320" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="660" y1="400" x2="700" y2="400" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="880" y1="320" x2="920" y2="320" stroke="#880e4f" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="880" y1="400" x2="920" y2="480" stroke="#880e4f" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="600" y1="510" x2="600" y2="540" stroke="#311b92" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Legend -->
  <g transform="translate(80,650)">
    <text x="0" y="0" font-size="12" font-weight="bold">Legend:</text>
    <rect x="80" y="-12" width="14" height="14" fill="#fff7e6" stroke="#b06b00"/>
    <text x="100" y="0" font-size="11">BFF / Edge</text>
    <rect x="190" y="-12" width="14" height="14" fill="#e8f5e9" stroke="#1b5e20"/>
    <text x="210" y="0" font-size="11">Microservice</text>
    <rect x="320" y="-12" width="14" height="14" fill="#e3f2fd" stroke="#0d47a1"/>
    <text x="340" y="0" font-size="11">Platform</text>
    <rect x="430" y="-12" width="14" height="14" fill="#fce4ec" stroke="#880e4f"/>
    <text x="450" y="0" font-size="11">Data</text>
    <rect x="510" y="-12" width="14" height="14" fill="#ede7f6" stroke="#311b92"/>
    <text x="530" y="0" font-size="11">Observability</text>
  </g>
</svg>
