<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, sans-serif">
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f4e79"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#fafbfc"/>
  <text x="600" y="34" font-size="22" font-weight="bold" fill="#1f4e79" text-anchor="middle">
    Authentication - Azure AD B2B + MFA + JWT
  </text>

  <!-- Lanes -->
  <g font-size="13" font-weight="bold" fill="#1f4e79">
    <line x1="120" y1="80"  x2="120" y2="640" stroke="#ddd"/>
    <line x1="320" y1="80"  x2="320" y2="640" stroke="#ddd"/>
    <line x1="540" y1="80"  x2="540" y2="640" stroke="#ddd"/>
    <line x1="760" y1="80"  x2="760" y2="640" stroke="#ddd"/>
    <line x1="980" y1="80"  x2="980" y2="640" stroke="#ddd"/>

    <text x="120" y="100" text-anchor="middle">User</text>
    <text x="320" y="100" text-anchor="middle">WebApp UI</text>
    <text x="540" y="100" text-anchor="middle">Azure AD</text>
    <text x="760" y="100" text-anchor="middle">Istio Gateway</text>
    <text x="980" y="100" text-anchor="middle">Backend</text>
  </g>

  <!-- Step boxes -->
  <g font-size="11">
    <!-- 1: external user invited -->
    <rect x="40" y="130" width="160" height="50" rx="4" fill="#fff" stroke="#1f4e79"/>
    <text x="120" y="150" text-anchor="middle" font-weight="bold">1. Invitation</text>
    <text x="120" y="168" text-anchor="middle">External user gets email</text>

    <!-- 2: redirect -->
    <rect x="240" y="200" width="160" height="50" rx="4" fill="#fff" stroke="#1f4e79"/>
    <text x="320" y="220" text-anchor="middle" font-weight="bold">2. /authorize</text>
    <text x="320" y="238" text-anchor="middle">redirect to AAD</text>

    <!-- 3: AAD login + MFA -->
    <rect x="460" y="270" width="160" height="80" rx="4" fill="#e7f1fb" stroke="#1f4e79"/>
    <text x="540" y="290" text-anchor="middle" font-weight="bold">3. Login + MFA</text>
    <text x="540" y="310" text-anchor="middle">password / MFA prompt</text>
    <text x="540" y="328" text-anchor="middle">conditional access</text>
    <text x="540" y="345" text-anchor="middle">policies evaluated</text>

    <!-- 4: id+access token -->
    <rect x="240" y="380" width="160" height="50" rx="4" fill="#fff" stroke="#1f4e79"/>
    <text x="320" y="400" text-anchor="middle" font-weight="bold">4. JWT issued</text>
    <text x="320" y="418" text-anchor="middle">id + access tokens</text>

    <!-- 5: API call -->
    <rect x="680" y="450" width="160" height="50" rx="4" fill="#fff" stroke="#1f4e79"/>
    <text x="760" y="470" text-anchor="middle" font-weight="bold">5. validate JWT</text>
    <text x="760" y="488" text-anchor="middle">RequestAuthentication</text>

    <!-- 6: AuthZ -->
    <rect x="900" y="520" width="160" height="80" rx="4" fill="#fff7e6" stroke="#b06b00"/>
    <text x="980" y="540" text-anchor="middle" font-weight="bold">6. service authZ</text>
    <text x="980" y="558" text-anchor="middle">@PreAuthorize</text>
    <text x="980" y="576" text-anchor="middle">SCOPE_x.read</text>
    <text x="980" y="594" text-anchor="middle">SCOPE_x.write</text>
  </g>

  <!-- Arrows -->
  <line x1="200" y1="155" x2="240" y2="220" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="400" y1="225" x2="460" y2="305" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="540" y1="350" x2="540" y2="380" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="540" y1="380" x2="400" y2="405" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="400" y1="405" x2="680" y2="475" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="840" y1="475" x2="900" y2="555" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#a5)"/>

  <!-- Notes -->
  <rect x="60" y="500" width="500" height="120" rx="6" fill="#ede7f6" stroke="#311b92"/>
  <text x="80" y="525" font-size="13" font-weight="bold">Token validation</text>
  <text x="80" y="548" font-size="11">- Issuer: https://login.microsoftonline.com/{tenant}/v2.0</text>
  <text x="80" y="566" font-size="11">- Audience: api://can</text>
  <text x="80" y="584" font-size="11">- Signing keys: AAD JWKS (auto-rotated)</text>
  <text x="80" y="602" font-size="11">- Validated TWICE: Istio gateway + Spring resource server</text>
</svg>
