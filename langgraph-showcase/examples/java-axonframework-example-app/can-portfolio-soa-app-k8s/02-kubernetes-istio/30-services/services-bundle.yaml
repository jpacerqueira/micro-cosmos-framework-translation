# webapp-ui (React/TS static bundle served by nginx)
apiVersion: v1
kind: ServiceAccount
metadata: { name: webapp-ui, namespace: can-app }
---
apiVersion: v1
kind: Service
metadata: { name: webapp-ui, namespace: can-app, labels: { app: webapp-ui } }
spec:
  selector: { app: webapp-ui }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: webapp-ui, namespace: can-app, labels: { app: webapp-ui } }
spec:
  replicas: 2
  selector: { matchLabels: { app: webapp-ui } }
  template:
    metadata:
      labels: { app: webapp-ui, version: v1 }
      annotations: { sidecar.istio.io/inject: "true" }
    spec:
      serviceAccountName: webapp-ui
      containers:
        - name: app
          image: <ACR_LOGIN_SERVER>/can/webapp-ui:1.0.0
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe:  { httpGet: { path: /healthz, port: http } }
