# vdr-ingestion - long-running ETL with bigger memory budget for Apache Tika.
apiVersion: v1
kind: Service
metadata: { name: vdr-ingestion, namespace: can-app, labels: { app: vdr-ingestion } }
spec:
  selector: { app: vdr-ingestion }
  ports: [{ name: http, port: 8080 }, { name: mgmt, port: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: vdr-ingestion, namespace: can-app, labels: { app: vdr-ingestion } }
spec:
  replicas: 2
  selector: { matchLabels: { app: vdr-ingestion } }
  template:
    metadata:
      labels: { app: vdr-ingestion, version: v1 }
      annotations: { sidecar.istio.io/inject: "true" }
    spec:
      serviceAccountName: can-workload-sa
      containers:
        - name: app
          image: <ACR_LOGIN_SERVER>/can/vdr-ingestion:1.0.0
          ports: [{ name: http, containerPort: 8080 }, { name: mgmt, containerPort: 8081 }]
          env:
            - { name: AXON_AXONSERVER_SERVERS, value: "axonserver.can-system.svc.cluster.local:8124" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://<PG_FQDN>:5432/can_app?sslmode=require&currentSchema=vdr" }
            - { name: SPRING_DATASOURCE_USERNAME, value: "canadmin" }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-credentials, key: password } }
            - { name: BLOB_STORAGE_ACCOUNT, value: "<STORAGE_ACCOUNT_NAME>" }
            - { name: BLOB_CONTAINER_RAW,   value: "vdr-raw" }
            - { name: BLOB_CONTAINER_CLEAN, value: "vdr-clean" }
            - { name: NATS_URL, value: "nats://nats.can-system.svc.cluster.local:4222" }
          resources: { requests: { cpu: 500m, memory: 2Gi }, limits: { cpu: 2, memory: 4Gi } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: mgmt } }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: mgmt }, initialDelaySeconds: 60 }
---
