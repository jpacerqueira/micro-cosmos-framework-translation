###############################################################################
# Microservices - User Auth, Property/Allocation/Valuation, VDR Ingestion,
# Workflow, Search. Each is a Spring Boot/Axon service. Pattern is identical
# to webapp-bff (see that file for the canonical comments); only the deltas
# in image, env vars, and AuthorizationPolicy are encoded here for brevity.
###############################################################################
# user-auth
---
apiVersion: v1
kind: Service
metadata: { name: user-auth, namespace: can-app, labels: { app: user-auth } }
spec:
  selector: { app: user-auth }
  ports: [{ name: http, port: 8080 }, { name: mgmt, port: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-auth, namespace: can-app, labels: { app: user-auth } }
spec:
  replicas: 2
  selector: { matchLabels: { app: user-auth } }
  template:
    metadata:
      labels: { app: user-auth, version: v1 }
      annotations: { sidecar.istio.io/inject: "true" }
    spec:
      serviceAccountName: can-workload-sa
      containers:
        - name: app
          image: <ACR_LOGIN_SERVER>/can/user-auth:1.0.0
          ports: [{ name: http, containerPort: 8080 }, { name: mgmt, containerPort: 8081 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "k8s" }
            - { name: AXON_AXONSERVER_SERVERS, value: "axonserver.can-system.svc.cluster.local:8124" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://<PG_FQDN>:5432/can_app?sslmode=require&currentSchema=user_mgmt" }
            - { name: SPRING_DATASOURCE_USERNAME, value: "canadmin" }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-credentials, key: password } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 1, memory: 1Gi } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: mgmt } }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: mgmt }, initialDelaySeconds: 30 }
---
