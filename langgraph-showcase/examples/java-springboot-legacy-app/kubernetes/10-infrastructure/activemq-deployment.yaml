apiVersion: apps/v1
kind: Deployment
metadata:
  name: activemq
  namespace: can-legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activemq
  template:
    metadata:
      labels:
        app: activemq
    spec:
      containers:
      - name: activemq
        image: apache/activemq-classic:5.18.3
        ports:
        - containerPort: 61616
        - containerPort: 8161
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: activemq
  namespace: can-legacy
spec:
  selector:
    app: activemq
  ports:
  - name: jms
    port: 61616
    targetPort: 61616
  - name: console
    port: 8161
    targetPort: 8161
