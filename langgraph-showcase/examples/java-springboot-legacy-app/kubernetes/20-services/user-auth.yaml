apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth
  namespace: can-legacy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-auth
  template:
    metadata:
      labels:
        app: user-auth
    spec:
      containers:
      - name: user-auth
        image: $(ACR_NAME).azurecr.io/can-legacy/user-auth:latest
        ports:
        - containerPort: 8001
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: SERVICE_NAME
          value: user-auth
        - name: ENVIRONMENT
          value: production
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: oracle-secret
              key: jdbc-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: oracle-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oracle-secret
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8001
          initialDelaySeconds: 90
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-auth
  namespace: can-legacy
spec:
  selector:
    app: user-auth
  ports:
  - port: 8001
    targetPort: 8001
