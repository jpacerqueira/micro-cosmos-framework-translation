apiVersion: apps/v1
kind: Deployment
metadata:
  name: vdr-ingestion
  namespace: can-legacy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vdr-ingestion
  template:
    metadata:
      labels:
        app: vdr-ingestion
    spec:
      containers:
      - name: vdr-ingestion
        image: $(ACR_NAME).azurecr.io/can-legacy/vdr-ingestion:latest
        ports:
        - containerPort: 8003
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: SERVICE_NAME
          value: vdr-ingestion
        - name: ENVIRONMENT
          value: production
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: oracle-secret
              key: jdbc-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: oracle-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oracle-secret
              key: password
        - name: SPRING_ACTIVEMQ_BROKER_URL
          value: tcp://activemq:61616
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8003
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8003
          initialDelaySeconds: 90
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vdr-ingestion
  namespace: can-legacy
spec:
  selector:
    app: vdr-ingestion
  ports:
  - port: 8003
    targetPort: 8003
