apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: can-legacy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: $(ACR_NAME).azurecr.io/can-legacy/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: can-legacy
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
