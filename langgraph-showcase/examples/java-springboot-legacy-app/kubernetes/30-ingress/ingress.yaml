apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-legacy-ingress
  namespace: can-legacy
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
  - host: can-legacy.example.com
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: webapp-bff
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: kibana.can-legacy.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana
            port:
              number: 5601
