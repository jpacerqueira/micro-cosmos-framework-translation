# =============================================================================
# Test profile — used by the Cucumber BDD suite only.
#
# H2 in-memory replaces Oracle 10g so `mvn test` is fully self-contained and
# runs inside the Docker build stage with no external Oracle/ActiveMQ
# containers. Schema is generated from the JPA entity annotations (ddl-auto),
# not from oracle/*.sql (those are Oracle-only DDL and stay production-only).
# =============================================================================

# TestJmsConfig re-declares the "jmsTemplate" bean (same bean name as
# JmsConfig in main) to inject FailureInjectingJmsTemplate. Spring Boot 2.1+
# rejects same-name bean overrides by default.
spring.main.allow-bean-definition-overriding=true

# -----------------------------------------------------------------------------
# H2 data source (stand-in for Oracle 10g)
# -----------------------------------------------------------------------------
## Plain H2 mode (not MODE=Oracle) — H2's Oracle compatibility mode disables
## the native "LIMIT" clause that Hibernate's H2Dialect generates for
## Pageable queries (e.g. TransactionRepository.findByTxnStatusOrderByTxnTs),
## which breaks pagination with a syntax error. Oracle syntax fidelity is
## exercised for real in production against Oracle10gDialect; the H2 stand-in
## only needs to satisfy Hibernate's own H2Dialect SQL.
spring.datasource.url=jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# -----------------------------------------------------------------------------
# JMS — embedded in-VM ActiveMQ broker, no external broker required
# -----------------------------------------------------------------------------
spring.activemq.broker-url=vm://test-broker?broker.persistent=false
spring.activemq.user=
spring.activemq.password=
spring.activemq.packages.trust-all=true

fraud.mq.alert-queue=FRAUD.ALERT.QUEUE

# -----------------------------------------------------------------------------
# Spring Batch (metadata always on its own H2 instance, same as production)
# -----------------------------------------------------------------------------
spring.batch.job.enabled=false
spring.batch.initialize-schema=always
spring.batch.datasource.url=jdbc:h2:mem:batchmeta-test;DB_CLOSE_DELAY=-1
spring.batch.datasource.driver-class-name=org.h2.Driver

# -----------------------------------------------------------------------------
# Fraud scoring constants — identical to production defaults so BDD scenarios
# assert against the real business thresholds (see ARCHITECTURE.md §7 / §13)
# -----------------------------------------------------------------------------
fraud.scoring.score-threshold=0.7500
fraud.scoring.decline-threshold=0.9000
fraud.scoring.high-amount-limit=5000.00
fraud.scoring.med-amount-limit=1000.00
fraud.scoring.low-amount-limit=200.00
fraud.scoring.velocity-limit-batch=10
fraud.scoring.velocity-limit-realtime=5
fraud.scoring.weight-amount=0.2500
fraud.scoring.weight-merchant=0.2500
fraud.scoring.weight-velocity=0.2000
fraud.scoring.weight-profile=0.2000
fraud.scoring.weight-watchlist=0.1000
# Raised from the production default (180ms) so the BDD suite's decision-mapping
# assertions aren't flaky under container scheduling jitter. Hooks resets this
# before every scenario; realtime_authorisation.feature has one dedicated
# scenario that deliberately sets it to -1 to test the SLA-breach path itself.
fraud.scoring.sla-limit-ms=5000

fraud.batch.cron=0 0 2 * * ?
fraud.batch.max-transactions=500

management.endpoints.web.exposure.include=health,info,metrics
