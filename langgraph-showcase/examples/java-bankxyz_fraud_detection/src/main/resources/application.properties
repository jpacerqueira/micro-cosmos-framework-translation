# =============================================================================
# BankXYZ Fraud Detection — Spring Boot configuration
# =============================================================================

spring.application.name=bankxyz-fraud-detection

# -----------------------------------------------------------------------------
# Oracle 10g data source
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=FDADMIN
spring.datasource.password=changeme
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate dialect for Oracle 10g
spring.jpa.database-platform=org.hibernate.dialect.Oracle10gDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Use BigDecimal for all NUMERIC columns — never Float
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

# -----------------------------------------------------------------------------
# JMS / ActiveMQ
# -----------------------------------------------------------------------------
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.activemq.packages.trust-all=true

fraud.mq.alert-queue=FRAUD.ALERT.QUEUE

# -----------------------------------------------------------------------------
# Spring Batch (nightly at 02:00)
# -----------------------------------------------------------------------------
spring.batch.job.enabled=false
spring.batch.initialize-schema=always
# H2 in-memory used for Spring Batch metadata tables only (not fraud data)
spring.batch.datasource.url=jdbc:h2:mem:batchmeta
spring.batch.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false

# Batch schedule: nightly 02:00
fraud.batch.cron=0 0 2 * * ?
# Maximum transactions per batch run
fraud.batch.chunk-size=100
fraud.batch.max-transactions=500

# -----------------------------------------------------------------------------
# Fraud scoring constants
# -----------------------------------------------------------------------------
fraud.scoring.score-threshold=0.7500
fraud.scoring.decline-threshold=0.9000
fraud.scoring.high-amount-limit=5000.00
fraud.scoring.med-amount-limit=1000.00
fraud.scoring.low-amount-limit=200.00
fraud.scoring.velocity-limit-batch=10
fraud.scoring.velocity-limit-realtime=5
fraud.scoring.weight-amount=0.2500
fraud.scoring.weight-merchant=0.2500
fraud.scoring.weight-velocity=0.2000
fraud.scoring.weight-profile=0.2000
fraud.scoring.weight-watchlist=0.1000
# Real-time SLA limit in milliseconds (BRD-2009-FD-004)
fraud.scoring.sla-limit-ms=180

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
